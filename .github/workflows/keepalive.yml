# Render's free plan sleeps the API after 15 min without traffic (the next
# visit then takes ~1 min). This pings it every 10 minutes from 6:00 to 22:59
# Bogotá time (UTC-5). While awake, the API's own scheduler runs the scraper.
name: API keep-alive

on:
  schedule:
    - cron: "*/10 11-23,0-3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up API
        run: curl -fsS --retry 5 --retry-delay 15 --max-time 90 https://autonegocio-api.onrender.com/health
